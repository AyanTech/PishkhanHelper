[versions]
agp = "9.3.0"
kotlin = "2.4.0"
ksp = "2.3.10"
androidx-core = "1.17.0"
androidx-appcompat = "1.6.1"
material = "1.12.0"
constraintlayout = "2.1.4"
junit = "4.13.2"
androidx-test-junit = "1.1.5"
espresso = "3.5.1"
whygoogle = "0.8.2"
networking-library = "1.6.7"
versioncontrol = "1.0.0"
download-manager = "1.6.1"
pushnotification = "1.1.14"
zxing = "3.5.0"
zxing-embedded = "4.3.0"
desugar = "2.0.4"
multidex = "2.0.1"
play-review = "2.0.1"
sdp = "1.1.1"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
whygoogle = { module = "com.github.shadowalker77:whygoogle", version.ref = "whygoogle" }
ayan-networking-library = { module = "com.github.shadowalker77:networking", version.ref = "networking-library" }
ayan-versioncontrol = { module = "com.github.AyanTech:versioncontrol", version.ref = "versioncontrol" }
android-http-download-manager = { module = "com.coolerfall:android-http-download-manager", version.ref = "download-manager" }
pushnotification = { module = "com.github.shadowalker77:pushnotification", version.ref = "pushnotification" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
google-play-review = { module = "com.google.android.play:review", version.ref = "play-review" }
intuit-sdp = { module = "com.intuit.sdp:sdp-android", version.ref = "sdp" }
intuit-ssp = { module = "com.intuit.ssp:ssp-android", version.ref = "sdp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
